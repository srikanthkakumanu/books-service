spring:
  application:
    name: ${SPRING_APP_NAME:books-service}

  devtools:
    restart:
      enabled: true

  threads: # Enable Virtual threads
    virtual:
      enabled: true

  # Jackson JSON mapper
  jackson:
    mapper:
      accept-case-insensitive-properties: true

  # JPA Hibernate
  # https://medium.com/@rihab.beji099/hibernate-schema-management-get-it-right-fast-spring-jpa-hibernate-ddl-auto-cfd86830daa2
  jpa:
    hibernate: # create/update/validate/create-drop/none
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
#      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    defer-datasource-initialization: false
    properties:
      hibernate:
        show_sql: ${SPRING_JPA_HIBERNATE_SHOW_SQL:false}
        format_sql: ${SPRING_JPA_HIBERNATE_FORMAT_SQL:false}
  sql:
    init:
      mode: always
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:booksadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:booksadmin}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/booksdb}

  # Flyway
  flyway:
    userDomain: ${FLYWAY_USERNAME:postgres}
    password: ${FLYWAY_USERNAME:postgres}
    sql-migration-prefix: V
    repeatable-sql-migration-prefix: R
    sql-migration-separator: __
    sql-migration-suffixes: .sql

  # Swagger/Open API
  # http://localhost:9151/swagger-ui/index.html
  doc:
    api-docs:
      path: /api-docs
    swagger-ui:
      operationsSorter: method
    show-actuator: true

server:
  port: ${SERVER_PORT:9151}


# Logging config
logging:
  level:
    root: ${ROOT_LOG_LEVEL:info}
#    books: debug
#    org.springframework.web: error
    org:
      hibernate: info
      hibernate.type.descriptor.sql: info
  pattern:
    level: ${LOG_PATTERN_CONSOLE:%green(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %blue(-%5level) %red([%thread]) %magenta(---){faint} %yellow(%logger{15}) - %msg%n}
#    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
#  file:
#    name: logs/books-service.log
#    max-size: 10MB
#    max-history: 10
#  org.springframework:
#    web:
#      filter:
#        CommonsRequestLoggingFilter: DEBUG
  config: classpath:logback-spring.xml

# Actuator Config
management:
  # OpenTelemetry Configuration
  opentelemetry:
    service:
      name: ${spring.application.name}
    traces:
      sampler:
        probability: 1.0 # Sample all traces
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT} # Removed default localhost fallback
    metrics:
      export:
        # OTLP endpoint for metrics
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL} # Changed placeholder name and removed default localhost fallback
        step: 1m # How often to export metrics
  endpoints:
    web:
      exposure:
        include: health, info, beans, env, metrics, auditevents, httptrace, loggers, threaddump
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
