plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.7'
	id 'io.spring.dependency-management' version '1.1.7'
	//id 'org.graalvm.buildtools.native' version '0.10.2'
}

group = 'books-service'
version = '1.0'
description = 'A micro service for Books and Authors Domain/Module'

java {
	sourceCompatibility = '24'
}

// For Mapstruct version
ext {
	mapstructVersion = "1.5.5.Final"
	swaggerVersion = "2.5.0"
	opentelemetryInstrumentationVersion = "2.6.0"
}

// For Spring Boot Actuator to show build information
springBoot {
	buildInfo()
}

repositories {
	mavenCentral()
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	// Exclude the Prometheus registry to avoid conflicts and warnings,
	// as this application uses the OTLP registry for metrics.
	// This is applied to all configurations to ensure it's not pulled in transitively.
	all {
		exclude group: 'io.micrometer', module: 'micrometer-registry-prometheus'
	}
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-graphql'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${swaggerVersion}"
  implementation 'org.springframework.boot:spring-boot-starter-web'
  
  implementation platform("io.opentelemetry:opentelemetry-bom:1.39.0")
  implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetryInstrumentationVersion}")
  // OTLP Exporter to send data to the collector
  implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
  // Logback appender to correlate logs with traces
  implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.15.0-alpha'

  // For structured JSON logging to the console
  implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'
  implementation "org.mapstruct:mapstruct:${mapstructVersion}"
  compileOnly 'org.projectlombok:lombok'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  runtimeOnly 'org.postgresql:postgresql'
  annotationProcessor 'org.projectlombok:lombok'
  annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
  annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.graphql:spring-graphql-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


// This section provides detailed test output to the terminal, which is great for debugging.
test {
	useJUnitPlatform()

	testLogging {
		events "passed", "skipped", "failed" //, "standardOut", "standardError"

		showExceptions true
		exceptionFormat "full"
		showCauses true
		showStackTraces true

		// Change to `true` for more verbose test output
		showStandardStreams = false
	}
}


